<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk break | PosturePilot</title>
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/landing.css">
<link rel="stylesheet" href="css/workout.css">
<link rel="stylesheet" href="css/extras.css">
</head>
<body>
<div class="wrap">
  <header class="topbar row" style="justify-content:space-between">
    <a class="brand" href="index.html"><i aria-hidden="true"></i>Posture<span>Pilot</span></a>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <mask id="moonCut">
            <rect width="24" height="24" fill="#fff"/>
            <circle class="cut" cx="17" cy="8" r="6.5" fill="#000"/>
          </mask>
        </defs>
        <g mask="url(#moonCut)"><circle class="core" cx="12" cy="12" r="5"/></g>
        <g class="rays" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="1.8" x2="12" y2="4" transform="rotate(0 12 12)"/>
          <line x1="12" y1="1.8" x2="12" y2="4" transform="rotate(45 12 12)"/>
          <line x1="12" y1="1.8" x2="12" y2="4" transform="rotate(90 12 12)"/>
          <line x1="12" y1="1.8" x2="12" y2="4" transform="rotate(135 12 12)"/>
          <line x1="12" y1="1.8" x2="12" y2="4" transform="rotate(180 12 12)"/>
          <line x1="12" y1="1.8" x2="12" y2="4" transform="rotate(225 12 12)"/>
          <line x1="12" y1="1.8" x2="12" y2="4" transform="rotate(270 12 12)"/>
          <line x1="12" y1="1.8" x2="12" y2="4" transform="rotate(315 12 12)"/>
        </g>
        <circle class="star s1" cx="19.5" cy="4.5" r="1"/>
        <circle class="star s2" cx="21.5" cy="9.5" r=".7"/>
      </svg>
    </button>
  </header>

  <main>
    <section class="panel" id="dkIntro">
      <h1 style="font-size:clamp(2rem,5vw,3rem)">Desk break</h1>
      <p class="lead2">About two minutes, mostly from your chair. No equipment and no change of clothes. Do it whenever you have been sitting for a while.</p>
      <div class="summary">
        <div><b id="dkTime"></b>minutes</div>
        <div><b id="dkCount"></b>moves</div>
        <div><b id="dkToday"></b>breaks today</div>
      </div>
      <ol class="dk-list" id="dkList"></ol>
      <p class="note" id="dkNote"></p>
      <div class="row">
        <button type="button" class="btn go big" id="dkStart">Start desk break</button>
        <a class="btn alt" href="reminders.html">Set reminders</a>
        <a class="btn alt" href="index.html">Back</a>
      </div>
      <p class="note" style="margin-top:18px">General guidance, not medical advice. Stop if anything hurts.</p>
    </section>
  </main>
</div>

<!-- full-screen desk break -->
<div class="wo" id="wo" hidden role="dialog" aria-modal="true" aria-label="Desk break">
  <section class="wo-screen" id="woActive">
    <div class="wo-top">
      <button type="button" class="wo-x" data-exit>End</button>
      <span class="wo-prog" id="woProg"></span>
      <button type="button" class="wo-x" id="woMute" aria-pressed="false">Sound on</button>
    </div>
    <div class="wo-bar" aria-hidden="true"><i id="woBar"></i></div>
    <div class="wo-main">
      <div class="wo-fig"><svg id="woSvg"></svg><div class="wo-flash" id="woFlash" hidden><span></span></div></div>
      <div class="wo-info">
        <span class="wo-pill" id="woPill"></span>
        <h2 class="wo-name" id="woName"></h2>
        <div class="wo-row">
          <div class="wo-timer">
            <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="54"/><circle class="arc" id="woArc" cx="60" cy="60" r="54" transform="rotate(-90 60 60)"/></svg>
            <b id="woTime" aria-live="off"></b>
          </div>
          <div>
            <p class="wo-cue" id="woCue"></p>
            <p class="wo-sub2" id="woSub2"></p>
            <p class="wo-side" id="woSide"></p>
          </div>
        </div>
        <p class="wo-next" id="woNext"></p>
        <ol class="wo-steps" id="woSteps"></ol>
        <p class="wo-tips" id="woTips"></p>
      </div>
    </div>
    <div class="wo-ctl">
      <button type="button" class="btn alt" id="woPause">Pause</button>
      <button type="button" class="btn" id="woSkip">Skip</button>
    </div>
  </section>

  <section class="wo-screen wo-done" id="woDone" hidden>
    <h2>Break complete</h2>
    <p class="wo-sub" id="woDoneText"></p>
    <div class="row" style="justify-content:center">
      <button type="button" class="btn go big" id="woAgain">Do it again</button>
      <button type="button" class="btn alt big" id="woBack">Finish</button>
    </div>
  </section>
</div>

<script src="js/storage.js"></script>
<script src="js/exercises.js"></script>
<script src="js/figure.js"></script>
<script src="js/desk-data.js"></script>
<script src="js/desk.js"></script>
<script src="js/notify.js"></script>
</body>
</html>
